<!-- Template Variables

title: The title of the article
preferred_link: The best link to associate with the article for linking out.

external_link_label: A localized label for the external link.
external_link_stripped: The external link minus the scheme. Useful for displaying the external link.
external_link: The external link of the article if there is one provided by the author.

feed_link_title: The name of the feed associated with this article.
feed_link: The URL of the feed associated with this article.
byline: HTML that combines all the authors and links to them if available.
avatar_src: The image source URL for the feed icon / avatar.
dateline_style: Either "articleDateline" or "articleDatelineTitle" depending on if the title was populated or not.

datetime_long: Long version of a combined publish date and time.
datetime_medium: Medium length version of a combined publish date and time.
datetime_short: Short version of a combined publish date and time.

date_long: Long version of the publish date.
date_medium: Medium version of the publish date.
date_short: Medium version of the publish date.

time_long: Long version of the publish time.
time_medium: Medium version of the publish time.
time_short: Medium version of the publish time.

text_size_class: The size class that the user has selected in Preferences for article text.
body: The body of the article.

-->

<nav class="readerToc" aria-label="Article sections" hidden>
	<div class="readerTocTitle">Sections</div>
	<div class="readerTocContext" aria-hidden="true"></div>
	<ol id="readerTocList"></ol>
</nav>

<header class="articleHeader" id="readerTop">
	<div class="articleTitle"><h1><a href="[[preferred_link]]">[[title]]</a></h1></div>
	<div class="articleMeta">
		<span class="byline">[[byline]]</span>
		<span class="metaDate"><a href="[[preferred_link]]">[[date_medium]]</a></span>
		<span class="feedName"><a href="[[feed_link]]">[[feed_link_title]]</a></span>
		<span class="readingTime" id="readingTime" hidden></span>
	</div>
	<div class="externalLink">[[external_link_label]] <a href="[[external_link]]">[[external_link_stripped]]</a></div>
</header>

<article>
	<div id="bodyContainer" class="articleBody [[text_size_class]]">[[body]]</div>
</article>

<footer class="calmUpdate" id="calmUpdate" hidden>
	<span class="calmUpdateText"></span>
	<a href="netnewswire://theme/add?url=https%3A%2F%2Fgithub.com%2Fraisulchowdhury%2Fcalm-nnwtheme%2Freleases%2Flatest%2Fdownload%2FCalm.nnwtheme.zip">Update</a>
</footer>

<script>
(function () {
	var body = document.getElementById("bodyContainer");
	var toc = document.querySelector(".readerToc");
	var tocList = document.getElementById("readerTocList");
	var tocContext = toc ? toc.querySelector(".readerTocContext") : null;
	var readingTime = document.getElementById("readingTime");
	var articleMeta = document.querySelector(".articleMeta");
	var metadataItems = articleMeta ? articleMeta.children : [];
	var title = document.querySelector(".articleTitle h1");
	var header = document.getElementById("readerTop");
	var externalLink = document.querySelector(".externalLink");
	var externalLinkAnchor = externalLink ? externalLink.querySelector("a") : null;
	var compactRailQuery = window.matchMedia ?
		window.matchMedia("(max-width: 820px), (pointer: coarse) and (max-height: 500px)") :
		null;
	var tocCleanup = null;

	function shouldDisableRail() {
		return compactRailQuery && compactRailQuery.matches;
	}

	function isPlaceholderValue(value) {
		return /^\s*\[\[[^\]]+\]\]\s*$/.test(value || "");
	}

	function hideEmptyExternalLink() {
		if (!externalLink) {
			return;
		}

		var href = externalLinkAnchor ? externalLinkAnchor.getAttribute("href") || "" : "";
		var label = externalLink.textContent.trim();
		var linkText = externalLinkAnchor ? externalLinkAnchor.textContent.trim() : "";
		if (!externalLinkAnchor || !href || !linkText || isPlaceholderValue(href) || isPlaceholderValue(linkText) || isPlaceholderValue(label)) {
			externalLink.hidden = true;
		}
	}

	// Feeds often pad an article with empty paragraphs or divs, such as an
	// editor's blank line or Blogger's separators, and each one adds a gap.
	// Mark a block only when it has no text, no media, and nothing a link
	// could point to. Blocks drawn with a background or border stay. A
	// clearing block keeps clearing floats but takes no height.
	function hideBlankBlocks() {
		if (!body) {
			return;
		}

		var invisibleText = /^[\s\u00a0\u200b\u200c\u200d\u2060\ufeff]*$/;
		var keepInside = "img, picture, video, audio, iframe, object, embed, svg, canvas, hr, table, input, select, textarea, button, [id], a[name]";
		Array.prototype.forEach.call(body.querySelectorAll("p, div"), function (block) {
			var style = block.getAttribute("style") || "";
			if (
				!invisibleText.test(block.textContent || "") ||
				block.id ||
				/background|border/i.test(style) ||
				block.querySelector(keepInside)
			) {
				return;
			}
			block.setAttribute("data-calm-blank", /clear/i.test(style) ? "clear" : "");
		});
	}

	// Some feeds wrap every block in line breaks (MacRumors sends
	// "<p><br><br><img><br><br>"), and each break adds a blank line around
	// images and paragraphs. Remove breaks at the start or end of a block,
	// between two blocks (MacRumors' deal buttons), and next to an image shown
	// on its own line. Breaks inside a run of text, such as a poem or an
	// address, stay.
	function removeStrayBreaks() {
		if (!body) {
			return;
		}

		function isBlank(node) {
			return node && node.nodeType === 3 && !/[^\s ​﻿]/.test(node.textContent);
		}

		function isBreak(node) {
			return node && node.nodeType === 1 && node.tagName === "BR";
		}

		function isBlockImage(node) {
			return node && node.nodeType === 1 && node.tagName === "IMG" && !node.hasAttribute("data-calm-inline");
		}

		var blockTags = /^(?:P|DIV|FIGURE|BLOCKQUOTE|UL|OL|DL|PRE|TABLE|H[1-6]|HR|SECTION|ARTICLE|ASIDE|HEADER|FOOTER|DETAILS)$/;
		function isBlock(node) {
			return node && node.nodeType === 1 && blockTags.test(node.tagName);
		}

		function sibling(node, direction) {
			var next = node[direction];
			while (isBlank(next)) {
				next = next[direction];
			}
			return next;
		}

		Array.prototype.forEach.call(body.querySelectorAll("br"), function (br) {
			var parent = br.parentNode;
			if (!parent || br.closest("pre, code, td, th") || (parent !== body && !/^(?:P|DIV|LI|BLOCKQUOTE|FIGURE|FIGCAPTION|SECTION|ARTICLE|DD|DT)$/.test(parent.tagName))) {
				return;
			}
			var before = sibling(br, "previousSibling");
			var after = sibling(br, "nextSibling");
			var run = [br];
			while (isBreak(after)) {
				run.push(after);
				after = sibling(after, "nextSibling");
			}
			while (isBreak(before)) {
				run.unshift(before);
				before = sibling(before, "previousSibling");
			}
			if (!before || !after || isBlockImage(before) || isBlockImage(after) || isBlock(before) && isBlock(after)) {
				run.forEach(function (node) {
					if (node.parentNode) {
						node.parentNode.removeChild(node);
					}
				});
			}
		});
	}

	// Icons and emoji drawn as images (Daring Fireball's 1em menu icons,
	// WordPress and Mastodon emoji) belong inside the line. Calm shows other
	// images as blocks, so mark these to keep them at text size. NetNewsWire's
	// image cleanup can't do it once Calm forces image heights, and Feedbin
	// strips the class and style that would say so.
	function markInlineImages() {
		if (!body) {
			return;
		}

		var emojiSource = /\/images\/core\/emoji\/|twemoji|\/custom_emojis\//i;
		Array.prototype.forEach.call(body.querySelectorAll("img"), function (image) {
			var height = (image.style && image.style.height) || "";
			var sizedInEm = /^(?:0?\.\d+|1(?:\.\d+)?|2)(?:em|rem)$/.test(height);
			var smallPixels = /^\d+(?:\.\d+)?px$/.test(height) && parseFloat(height) <= 32;
			var attributeHeight = parseInt(image.getAttribute("height"), 10);
			var attributeWidth = parseInt(image.getAttribute("width"), 10);
			var smallAttributes = attributeHeight > 0 && attributeHeight <= 32 && (!attributeWidth || attributeWidth <= 64);
			var emoji = /(?:^|\s)(?:emoji|wp-smiley|custom-emoji|twemoji)(?:\s|$)/.test(image.className || "") || emojiSource.test(image.getAttribute("src") || "");
			if (attributeWidth > 64 || attributeHeight > 64) {
				return;
			}
			if (attributeHeight === 1 && attributeWidth === 1) {
				image.setAttribute("data-calm-blank", "");
			} else if (sizedInEm || smallPixels || smallAttributes || emoji) {
				image.setAttribute("data-calm-inline", "");
			}
		});
	}

	// FreshRSS renames every id in an article to data-sanitized-id, and Feedly
	// drops ids altogether, so a footnote link points at nothing and opens no
	// popover. Put back the ids that a link in the article points at. With
	// Feedly, the note is the list item holding the back link: the item that
	// links to #fnref-1 is the note #fn-1. An id already on the page stays
	// where it is.
	function restoreFootnoteIds() {
		if (!body) {
			return;
		}

		var targets = {};
		Array.prototype.forEach.call(body.querySelectorAll("a[href*='#']"), function (link) {
			var id = "";
			try {
				id = link.hash ? decodeURIComponent(link.hash.slice(1)) : "";
			} catch (error) {
				return;
			}
			if (id && !targets[id] && !document.getElementById(id)) {
				targets[id] = link;
			}
		});

		Array.prototype.forEach.call(body.querySelectorAll("[data-sanitized-id]"), function (element) {
			var id = element.getAttribute("data-sanitized-id");
			if (id && targets[id] && !element.id && !document.getElementById(id)) {
				element.id = id;
			}
		});

		Object.keys(targets).forEach(function (referenceId) {
			if (!/fnref/i.test(referenceId) || document.getElementById(referenceId)) {
				return;
			}
			var noteId = referenceId.replace(/fnref/i, "fn");
			var reference = targets[noteId];
			var note = targets[referenceId].closest("li");
			if (!reference || !note || note.id || note.contains(reference) || document.getElementById(noteId)) {
				return;
			}
			note.id = noteId;
			var marker = reference.closest("sup");
			if (marker && !marker.id) {
				marker.id = referenceId;
			}
		});
	}

	// Six Colors and other WordPress sites link footnotes to the site's home
	// page plus the note's id ("https://sixcolors.com#fn-1"), so NetNewsWire
	// doesn't see them as footnotes and a tap leaves the app. When the note is
	// in this article, mark the link so it opens NetNewsWire's popover.
	function markFootnotes() {
		if (!body) {
			return;
		}

		// Pandoc and GitHub mark the reference with role or data attributes, and
		// GitHub prefixes ids with "user-content-". WordPress's footnotes block
		// names notes by a random id inside sup[data-fn].
		var references = "sup a[href*='#'], a[rel='footnote'][href*='#'], a[role='doc-noteref'][href*='#'], a.footnote-ref[href*='#'], a[data-footnote-ref][href*='#']";
		Array.prototype.forEach.call(body.querySelectorAll(references), function (link) {
			var hash = "";
			try {
				hash = link.hash ? decodeURIComponent(link.hash.slice(1)) : "";
			} catch (error) {
				return;
			}
			var key = hash.replace(/^user-content-/i, "");
			var wordPressNote = link.closest("sup[data-fn]");
			if (!link.classList.contains("footnote")) {
				if (!wordPressNote && (!/^(?:fn|footnote)/i.test(key) || /^fnref/i.test(key))) {
					return;
				}
				var note = document.getElementById(hash);
				if (!note || !body.contains(note) || note.contains(link) || wordPressNote && !note.closest(".wp-block-footnotes")) {
					return;
				}
				link.classList.add("footnote");
			}
			// Pandoc puts the <sup> inside the link, so a tap lands on the <sup>
			// and NetNewsWire, which listens for taps on links, opens nothing.
			// Turn <a><sup>1</sup></a> into <sup><a>1</a></sup>, as other
			// platforms write it; it looks the same.
			var inner = link.firstElementChild;
			if (inner && inner.tagName === "SUP" && link.children.length === 1 && !link.closest("sup") && link.textContent.trim() === inner.textContent.trim()) {
				link.parentNode.insertBefore(inner, link);
				while (inner.firstChild) {
					link.appendChild(inner.firstChild);
				}
				inner.appendChild(link);
			}
		});
	}

	// Many WordPress feeds end each post with "The post <title> appeared first
	// on <site>." (WPBeginner: "first appeared on"), Medium with "<title> was
	// originally published in <publication> on Medium, where people are
	// continuing the conversation...", and OMG! Ubuntu with "You're reading
	// <title>, a blog post from <site>. Do not reproduce elsewhere without
	// permission." The sites never show these lines. Hide one when it is the
	// article's last block and holds the two links, to the post and the site.
	var feedCreditPatterns = [/^(?:The post|Der Beitrag|L['\u2019]article|La entrada|Il post|O post|Het bericht|Inl\u00e4gget|Indl\u00e6gget) [\s\S]{1,300} (?:appeared first on|first appeared on|erschien zuerst auf|est apparu en premier sur|apareci\u00f3 primero en|\u00e8 apparso per primo su|apareceu primeiro em|verscheen eerst op|d\u00f6k upp f\u00f6rst p\u00e5|dukkede op f\u00f8rst p\u00e5) [\s\S]{1,200}$/i,
		/^[\s\S]{1,300} was originally published in [\s\S]{1,200} on Medium, where people are continuing the conversation by highlighting and responding to this story\.?$/,
		/^You['\u2019]re reading [\s\S]{1,300}, a blog post from [\s\S]{1,200}\. Do not reproduce elsewhere without permission\.?$/];

	function hideFeedCredit() {
		if (!body) {
			return;
		}

		function hasContent(element) {
			if (element.hasAttribute("data-calm-blank")) {
				return false;
			}
			if ((element.textContent || "").trim()) {
				return true;
			}
			var media = "img, video, audio, iframe, svg, hr";
			return element.matches(media) || Array.prototype.some.call(element.querySelectorAll(media), function (node) {
				return !node.hasAttribute("data-calm-blank");
			});
		}

		var container = body;
		var last = null;
		while (container) {
			last = null;
			for (var child = container.lastElementChild; child; child = child.previousElementSibling) {
				if (hasContent(child)) {
					last = child;
					break;
				}
			}
			if (last && /^(?:DIV|SECTION|ARTICLE)$/.test(last.tagName) && !last.className) {
				container = last;
			} else {
				container = null;
			}
		}
		if (!last || last.tagName !== "P" || last.querySelectorAll("a").length < 2) {
			return;
		}
		var text = (last.textContent || "").replace(/\s+/g, " ").trim();
		if (!feedCreditPatterns.some(function (pattern) { return pattern.test(text); })) {
			return;
		}
		last.setAttribute("data-calm-feed-credit", "");
		// Medium draws a rule above its line; with the line gone it would end the article.
		var before = last.previousElementSibling;
		while (before && !hasContent(before)) {
			before = before.previousElementSibling;
		}
		if (before && before.tagName === "HR") {
			before.setAttribute("data-calm-feed-credit", "");
		}
	}

	// A newsletter sign-up form can't work inside a reader, so the stylesheet
	// hides it. Where the form says where to sign up, put one quiet pill in its
	// place that opens that page: Mailchimp's hosted form, Substack's and
	// Ghost's subscribe pages, or a sign-up link inside the block. No usable
	// page, or a sign-up link already beside the form, means no pill. Labelled
	// with the form's own button text.
	// Most articles have no form or frame, so the cheap check runs first and the
	// full selector, with its :has() tests, only when a candidate is there.
	var signupWidgets = ".subscription-widget-wrap, .subscription-widget-wrap-editor, [data-component-name='SubscribeWidgetToDOM'], #mc_embed_signup, #mc_embed_shell, .formkit-form, .kg-signup-card, .wp-block-jetpack-subscriptions, .mailpoet_form";
	var signupBlocks = signupWidgets + ", form[action*='list-manage.com']:has(input[type='email']), form[action*='subscribe' i]:has(input[type='email']), form[action*='signup' i]:has(input[type='email']), form[action*='newsletter' i]:has(input[type='email']), form[action*='convertkit']:has(input[type='email']), form[action*='buttondown']:has(input[type='email']), form[action*='beehiiv']:has(input[type='email']), form[action*='substack.com']:has(input[type='email']), iframe[src*='substack.com/embed']";
	var signupWords = /\b(?:sign[\s-]?up|subscribe|newsletter|join (?:the|our|my) (?:list|newsletter|mailing list))\b/i;
	// "subscribe" or "sign-up" as a whole path word, so /unsubscribe doesn't count.
	var signupPath = /(?:^|[\/#._-])(?:subscribe|sign-?up)(?:$|[\/?#._-])/i;

	function signupPage(block) {
		function isSignupLink(link) {
			return /^https?:/i.test(link.href) && (signupWords.test(link.textContent || "") || signupPath.test(link.pathname + link.hash));
		}
		var inside = Array.prototype.find.call(block.querySelectorAll("a[href]"), isSignupLink);
		if (inside) {
			return inside.href;
		}
		var form = block.matches("form") ? block : block.querySelector("form");
		var action = block.matches("iframe") ? block.getAttribute("src") || "" : form ? form.getAttribute("action") || "" : "";
		var url = null;
		try {
			url = action ? new URL(action, document.baseURI) : null;
		} catch (error) {}
		if (url && /^https?:$/.test(url.protocol)) {
			// Mailchimp posts to /subscribe/post; /subscribe with the same list is its hosted form.
			if (/(^|\.)list-manage\.com$/i.test(url.hostname) && /^\/subscribe\/post(?:-json)?\/?$/.test(url.pathname) && url.searchParams.get("u")) {
				return url.origin + "/subscribe?u=" + encodeURIComponent(url.searchParams.get("u")) + (url.searchParams.get("id") ? "&id=" + encodeURIComponent(url.searchParams.get("id")) : "");
			}
			// Substack's own form posts to its API; the publication's /subscribe page signs up.
			if (/(^|\.)substack\.com$/i.test(url.hostname) && url.hostname.toLowerCase() !== "substack.com") {
				return url.origin + "/subscribe";
			}
		}
		var page = null;
		try {
			page = new URL(document.baseURI);
		} catch (error) {}
		if (!page || !/^https?:$/.test(page.protocol)) {
			return null;
		}
		if (block.matches(".subscription-widget-wrap, .subscription-widget-wrap-editor, [data-component-name='SubscribeWidgetToDOM']")) {
			return page.origin + "/subscribe";
		}
		if (block.matches(".kg-signup-card")) {
			return page.origin + "/#/portal/signup";
		}
		return null;
	}

	function hasSignupLinkBeside(block) {
		// Read the text just before and just after the block in document order, so
		// broken feed markup (MacRumors puts the form inside stray p and div
		// wrappers, after a "Sign up" sentence) still counts as "beside".
		function isSignupLink(node) {
			return node.nodeType === 1 && node.matches("a[href]") && !block.contains(node) && !node.closest("[data-calm-signup]") &&
				(signupWords.test(node.textContent || "") || (signupPath.test(node.pathname + node.hash) || /(?:^|\.)eepurl\.com$/i.test(node.hostname)));
		}
		function scan(walker, step, limit) {
			var seen = 0;
			var node;
			while ((node = walker[step]()) && seen < limit) {
				if (node.nodeType === 3) {
					seen += node.nodeValue.trim().length;
				} else if (isSignupLink(node)) {
					return true;
				}
			}
			return false;
		}
		var before = document.createTreeWalker(body, 5);
		before.currentNode = block;
		var after = document.createTreeWalker(body, 5);
		after.currentNode = block.lastChild ? block.lastChild : block;
		while (after.currentNode.lastChild) {
			after.currentNode = after.currentNode.lastChild;
		}
		return scan(before, "previousNode", 240) || scan(after, "nextNode", 120);
	}

	function offerSignupPages() {
		if (!body || !(body.getElementsByTagName("form").length || body.getElementsByTagName("iframe").length || body.querySelector(signupWidgets))) {
			return;
		}
		var signups = Array.prototype.filter.call(body.querySelectorAll(signupBlocks), function (block) {
			return !(block.parentElement && block.parentElement.closest(signupBlocks));
		});
		signups.forEach(function (block) {
			if (hasSignupLinkBeside(block)) {
				return;
			}
			var href = signupPage(block);
			if (!href) {
				return;
			}
			var submit = block.querySelector("button[type='submit'], form button:not([type]), input[type='submit']");
			var label = submit ? (submit.matches("input") ? submit.value : submit.textContent) : "";
			label = (label || "").replace(/\s+/g, " ").trim();
			if (!label || label.length > 40) {
				label = "Subscribe";
			}
			var wrapper = document.createElement("p");
			wrapper.className = "button-wrapper";
			wrapper.setAttribute("data-calm-signup", "");
			var link = document.createElement("a");
			link.className = "button";
			link.href = href;
			link.textContent = label;
			wrapper.appendChild(link);
			block.parentNode.insertBefore(wrapper, block);
		});
	}

	// Bluesky, Mastodon, and micro.blog posts have no title. Drop the empty
	// heading so the post starts right under its source and date.
	function markUntitled() {
		if (!header || !title) {
			return;
		}
		var text = title.textContent.trim();
		if (!text || isPlaceholderValue(text)) {
			header.classList.add("isUntitled");
		}
	}

	// NetNewsWire leaves the page's language unset, so Chinese, Japanese,
	// Korean, Arabic, and Hebrew articles get Latin line breaking and whatever
	// font the system picks. When most of the opening text is one of those
	// scripts, say so; the stylesheet then picks a serif for it.
	function markArticleLanguage() {
		if (!body || !body.closest || body.closest("[lang]")) {
			return;
		}
		var sample = (body.textContent || "").slice(0, 1500);
		var letters = sample.replace(/[\s\d\p{P}\p{S}]/gu, "").length;
		if (letters < 20) {
			return;
		}
		function share(pattern) {
			return (sample.match(pattern) || []).length / letters;
		}
		var lang = "";
		if (share(/[぀-ヿ]/g) > 0.1) {
			lang = "ja";
		} else if (share(/[가-힯]/g) > 0.3) {
			lang = "ko";
		} else if (share(/[一-鿿]/g) > 0.3) {
			lang = "zh";
		} else if (share(/[؀-ۿ]/g) > 0.3) {
			lang = "ar";
		} else if (share(/[֐-׿]/g) > 0.3) {
			lang = "he";
		}
		if (lang) {
			body.setAttribute("lang", lang);
			if (header) {
				header.setAttribute("lang", lang);
			}
		}
	}

	// Ghost galleries come as rows of images that Ghost's own script sizes.
	// Give each image a share of its row in proportion to its shape, so a row
	// lines up at one height the way it does on the site.
	function layoutGalleries() {
		if (!body) {
			return;
		}
		Array.prototype.forEach.call(body.querySelectorAll(".kg-gallery-image"), function (cell) {

				sectionTargets.push({ element: heading });
			});
		} else {
			for (var i = 0; i < markerCount; i++) {
				var ratio = i / (markerCount - 1);
				var label = markerLabels[i] || ("Section " + (i + 1));
				var cssClass = i === 0 ? "article" : "section";
				addTocItem(label, cssClass);
				sectionTargets.push({ ratio: ratio });
			}
		}

		if (tocList.children.length < 1) {
			toc.hidden = true;
			return;
		}
		toc.hidden = false;

		var controls = Array.prototype.slice.call(tocList.querySelectorAll("button"));

		function setActiveSection(activeIndex) {
			controls.forEach(function (control, index) {
				var item = control.parentElement;

				}

				item.classList.toggle("is-after", activeIndex > -1 && index > activeIndex);
			});

			var activeControl = activeIndex > -1 ? controls[activeIndex] : null;
			if (tocContext && useHeadingTargets && activeControl) {
				var activeRect = activeControl.getBoundingClientRect();
				var tocRect = toc.getBoundingClientRect();
				tocContext.textContent = activeControl.getAttribute("data-label") || "";
				tocContext.style.top = (activeRect.top - tocRect.top + activeRect.height / 2) + "px";
			} else if (tocContext) {
				tocContext.textContent = "";
				tocContext.style.top = "";

		}

		function getTargetTop(section) {
			var scrollTop = window.pageYOffset || root.scrollTop || document.body.scrollTop || 0;
			if (section.element) {

		// Cache where the page should scroll for each marker, not where each
		// target sits. Headings scroll to the marker line, depth markers to their
		// share of the scroll range, so "Bottom" reaches the true end.
		function getTargetScrollTop(section, markerOffset, scrollMax) {
			var top = getTargetTop(section);
			if (section.element) {
				top = top <= 0 ? 0 : top - markerOffset;
			}
			return Math.max(0, Math.min(scrollMax, top));
		}

		function cacheTargetOffsets() {
			var markerOffset = getMarkerOffset();
			var scrollMax = getScrollMax();
			cachedTargetTops = sectionTargets.map(function (section) {
				return getTargetScrollTop(section, markerOffset, scrollMax);
			});

			// Headings on the article's last screen can't scroll up to the marker
			// line, so they would all share the bottom position and only the last
			// could ever be current. Spread them across the final stretch of
			// scrolling, in order, so each one gets its own place.
			var firstUnreachable = -1;
			for (var index = 0; index < cachedTargetTops.length; index++) {
				if (index > 0 && cachedTargetTops[index] >= scrollMax) {
					firstUnreachable = index;
					break;
				}
			}
			if (firstUnreachable < 0) {
				return;
			}
			var start = cachedTargetTops[firstUnreachable - 1];
			var count = cachedTargetTops.length - firstUnreachable;
			for (var step = 0; step < count; step++) {
				cachedTargetTops[firstUnreachable + step] = Math.round(start + (scrollMax - start) * (step + 1) / count);
			}
		}

		function cacheMarkerCenters() {
			markerCenters = controls.map(function (control) {
				var rect = control.getBoundingClientRect();
				return rect.top + rect.height / 2;
			});
		}

		function getNearestMarkerIndexFromY(clientY) {
			if (markerCenters.length < 1) {
				return -1;
			}

			var activeIndex = 0;
			var bestDistance = Infinity;
			markerCenters.forEach(function (centerY, index) {
				var distance = Math.abs(centerY - clientY);
				if (distance < bestDistance) {
					bestDistance = distance;
					activeIndex = index;
				}
			});
			return activeIndex;
		}

		function setScrubTargetFromY(clientY) {
			var nextIndex = getNearestMarkerIndexFromY(clientY);
			if (nextIndex !== scrubIndex) {
				scrubIndex = nextIndex;
				setActiveSection(scrubIndex);
			}
		}

		function beginScrub(pointerId, clientY) {
			isScrubbing = true;
			activePointerId = pointerId;
			cacheMarkerCenters();
			setScrubTargetFromY(clientY);
			toc.classList.add("isScrubbing");
		}

		function moveScrub(clientY) {
			if (!isScrubbing) {
				return;
			}
			setScrubTargetFromY(clientY);
		}

		function endScrub() {
			if (!isScrubbing) {
				return;
			}
			isScrubbing = false;
			toc.classList.remove("isScrubbing");
			activePointerId = null;
			activeTouchId = null;
			var indexToScroll = scrubIndex;
			scrubIndex = -1;
			if (indexToScroll > -1) {
				scrollToSection(sectionTargets[indexToScroll], indexToScroll);
			}
			updateActiveFromScroll();
		}

		function getBehavior() {
			if (reducedMotionQuery && reducedMotionQuery.matches) {
				return "auto";
			}
			return "smooth";
		}

		function updateActiveFromScroll() {
			if (sectionTargets.length < 1) {
				return;
			}

			var scrollTop = window.pageYOffset || root.scrollTop || document.body.scrollTop || 0;
			var activeIndex = 0;
			cachedTargetTops.forEach(function (targetScrollTop, index) {
				if (scrollTop + ACTIVE_SECTION_TOLERANCE >= targetScrollTop) {
					activeIndex = index;
				}
			});
			setActiveSection(activeIndex);
		}

		function scrollToSection(section, sectionIndex) {
			if (!section) {
				return;
			}
			var nextTop = cachedTargetTops[sectionIndex];
			if (typeof nextTop !== "number") {
				nextTop = getTargetScrollTop(section, getMarkerOffset(), getScrollMax());
			}
			try {
				window.scrollTo({
					top: nextTop,
					left: 0,
					behavior: getBehavior()
				});
			} catch (error) {

			}
		}

		function getTouchPoint(event, touchId) {
			var points = event.touches || event.changedTouches;
			if (!points || points.length < 1) {
				return null;
			}
			for (var i = 0; i < points.length; i++) {
				var touch = points[i];
				if (touch.identifier === touchId) {
					return touch;
				}
			}
			return points[0];
		}

		function onPointerDown(event) {
			if (event.button && event.button !== 0) {

			}
			if (!event.isPrimary) {

			}
			event.preventDefault();
			if (toc.setPointerCapture) {

					toc.setPointerCapture(event.pointerId);

				}

		}

		function onPointerMove(event) {

				return;
			}
			event.preventDefault();
			moveScrub(event.clientY);
		}

		function onPointerEnd(event) {
			if (!isScrubbing) {
				return;
			}
			if (activePointerId !== null && event.pointerId !== activePointerId) {
				return;
			}
			event.preventDefault();
			endScrub();
		}

		function onTouchStart(event) {
			if (isScrubbing || !event.touches || event.touches.length < 1) {
				return;
			}
			var touch = event.touches[0];
			activeTouchId = touch.identifier;
			event.preventDefault();
			beginScrub(null, touch.clientY);
		}

		function onTouchMove(event) {
			if (!isScrubbing || !event.touches || event.touches.length < 1) {
				return;
			}
			var touch = getTouchPoint(event, activeTouchId);
			if (!touch) {
				return;
			}
			event.preventDefault();
			moveScrub(touch.clientY);
		}

		function onTouchEnd(event) {
			if (!isScrubbing) {
				return;
			}
			if (!event.changedTouches || event.changedTouches.length < 1) {
				return;
			}
			var touch = getTouchPoint(event, activeTouchId);
			if (!touch) {
				return;
			}
			event.preventDefault();
			endScrub();
		}

		if (hasPointerEvents) {
			toc.addEventListener("pointerdown", onPointerDown, { passive: false });
			toc.addEventListener("pointermove", onPointerMove, { passive: false });
			toc.addEventListener("pointerup", onPointerEnd, { passive: false });
			toc.addEventListener("pointercancel", onPointerEnd, { passive: false });
			toc.addEventListener("pointerleave", onPointerEnd, { passive: false });

			toc.addEventListener("touchstart", onTouchStart, { passive: false });
			toc.addEventListener("touchmove", onTouchMove, { passive: false });
			toc.addEventListener("touchend", onTouchEnd, { passive: false });
			toc.addEventListener("touchcancel", onTouchEnd, { passive: false });
		}

		var controlClickHandlers = controls.map(function (control, index) {
			var clickHandler = function (event) {
				event.preventDefault();

				setActiveSection(index);
			};
			control.addEventListener("click", clickHandler);
			return clickHandler;
		});

		function refreshLayout() {
			cacheTargetOffsets();
			cacheMarkerCenters();
			toc.hidden = root.scrollHeight < window.innerHeight * 2;
			updateActiveFromScroll();
		}

		function runActiveUpdate() {
			scrollFrame = null;
			updateActiveFromScroll();
		}

		function requestActiveUpdate() {

			}

	}

	function resetToc() {
		if (!toc || !tocList) {
			return;
		}
		toc.hidden = true;
		toc.classList.remove("is-heading-based");
		toc.classList.remove("isScrubbing");
		tocList.textContent = "";
		if (tocContext) {
			tocContext.textContent = "";
			tocContext.style.top = "";
		}
	}

	// Footnotes open in the text. A tap on the number puts the note on its own
	// lines right under the line that holds the number, pushing what follows
	// down; another tap on the number, or Escape, closes it and the text goes
	// back exactly as it was. NetNewsWire's own popover (newsfoot.js) floats
	// over the lines below and covers them, so this takes the tap first. At
	// load this adds one listener and touches no footnote; a note is built only
	// when it is opened.
	function enableFootnoteNotes() {
		if (!body) {
			return;
		}

		var openNotes = [];
		var count = 0;
		var blocks = "p, li, dd, dt, blockquote, td, th, figcaption, h1, h2, h3, h4, h5, h6";
		var backLinks = "a[href*='#fnr'], a[href^='#'][href$='-link'], [role='doc-backlink'], [data-footnote-backref], .footnote-back, .footnote-backref, .footnote-return, .reversefootnote, .footnoteBackLink";

		// A back link (to #fnref..., or one of the platforms' back-link
		// classes) is never a marker, even where a platform calls it "footnote".
		function isMarker(link) {
			if (link.matches(backLinks) || /^#(?:user-content-)?fnref/i.test(link.hash)) {
				return false;
			}
			return link.classList.contains("footnote") || link.matches("a[id^='footnote-anchor-']");
		}

		// The note's text, without the back arrow and without ids that would
		// repeat ones already on the page.
		function noteFor(link) {
			var id = "";
			try {
				id = link.hash ? decodeURIComponent(link.hash.slice(1)) : "";
			} catch (error) {
				return null;
			}
			var target = id && document.getElementById(id);
			if (!target || !body.contains(target) || target.contains(link)) {
				return null;
			}
			var note = document.createElement("span");
			if (link.matches("a[id^='footnote-anchor-']")) {
				// Substack: the target is the note's own number, and its text
				// follows in the elements after it.
				for (var node = target.nextElementSibling; node && !node.matches("a[id^='footnote-']"); node = node.nextElementSibling) {
					note.appendChild(node.cloneNode(true));
				}
			} else {
				Array.prototype.forEach.call(target.childNodes, function (child) {
					note.appendChild(child.cloneNode(true));
				});
			}
			Array.prototype.forEach.call(note.querySelectorAll("a"), function (anchor) {
				var href = anchor.getAttribute("href") || "";
				if (anchor.matches(backLinks) || href.charAt(0) === "#" && /^[\s↩↑⏎⤴^︎️]*$/.test(anchor.textContent)) {
					anchor.remove();
				}
			});
			Array.prototype.forEach.call(note.querySelectorAll("[id]"), function (element) {
				element.removeAttribute("id");
			});
			if (!note.textContent.trim()) {
				return null;
			}
			var number = document.createElement("span");
			number.className = "calmNoteNumber";
			number.textContent = link.textContent.trim().replace(/^\[(.*)\]$/, "$1");
			// The number leads the note's first line: inside its first
			// paragraph, also when a wrapper holds that paragraph (Substack's
			// div.footnote-content).
			var lead = note;
			for (var first = note.firstChild; first; first = first.firstChild) {
				while (first && (first.nodeType === 8 || (first.nodeType === 3 && !first.data.trim()))) {
					first = first.nextSibling;
				}
				if (!first || first.nodeType !== 1 || !/^(?:P|DIV|SECTION)$/.test(first.tagName)) {
					break;
				}
				lead = first;
				if (first.tagName === "P") {
					break;
				}
			}
			while (lead.firstChild && (lead.firstChild.nodeType === 8 || (lead.firstChild.nodeType === 3 && !lead.firstChild.data.trim()))) {
				lead.firstChild.remove();
			}
			lead.insertBefore(document.createTextNode(" "), lead.firstChild);
			lead.insertBefore(number, lead.firstChild);
			note.className = "calmNote";
			note.setAttribute("role", "note");
			note.id = "calm-note-" + (++count);
			return note;
		}

		// Where the line holding the marker ends: the first character after it
		// that sits on a lower line. The note goes there, so the lines above it
		// keep their words. If that point is inside a link, the link ends at
		// the line's end and continues after the note.
		function place(link, note) {
			var marker = link.closest("sup") || link;
			var block = marker.closest(blocks);
			if (!block || !body.contains(block)) {
				marker.parentNode.insertBefore(note, marker.nextSibling);
				return null;
			}
			var bottom = marker.getBoundingClientRect().bottom;
			var range = document.createRange();
			var walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, null, false);
			walker.currentNode = marker;
			var text;
			while ((text = walker.nextNode())) {
				if (marker.contains(text) || !text.data.trim()) {
					continue;
				}
				range.setStart(text, text.data.length - 1);
				range.setEnd(text, text.data.length);
				var last = range.getBoundingClientRect();
				if (!last.height || last.top < bottom) {
					continue;
				}
				var low = 0;
				var high = text.data.length - 1;
				while (low < high) {
					var middle = (low + high) >> 1;
					range.setStart(text, middle);
					range.setEnd(text, middle + 1);
					var rect = range.getBoundingClientRect();
					if (rect.height && rect.top >= bottom) {
						high = middle;
					} else {
						low = middle + 1;
					}
				}
				// The new line starts at this character, or at the outermost
				// element that begins with it.
				var point = text;
				if (low === 0) {
					while (point.parentNode !== block && !point.previousSibling) {
						point = point.parentNode;
					}
				}
				var inText = point === text && low > 0;
				// Inside emphasis or a span the note can go in place; a link
				// would carry its tap and underline into the note.
				var anchor = null;
				for (var up = point.parentNode; up !== block; up = up.parentNode) {
					if (up.tagName === "A") {
						anchor = up;
					}
				}
				if (!anchor) {
					if (!inText) {
						point.parentNode.insertBefore(note, point);
						return null;
					}
					var rest = text.splitText(low);
					text.parentNode.insertBefore(note, rest);
					return { before: text, rest: rest };
				}
				// The line ends inside a link: end the link there and carry on
				// in a copy of it after the note. Closing joins them again.
				var depth = 0;
				for (var level = inText ? text.parentNode : point.parentNode; level !== anchor; level = level.parentNode) {
					depth++;
				}
				if (inText) {
					range.setStart(text, low);
				} else {
					range.setStartBefore(point);
				}
				range.setEnd(anchor, anchor.childNodes.length);
				var tail = anchor.cloneNode(false);
				tail.appendChild(range.extractContents());
				for (var copy = tail, i = 0; copy && copy.nodeType === 1 && i <= depth; copy = copy.firstChild, i++) {
					copy.removeAttribute("id");
				}
				anchor.parentNode.insertBefore(tail, anchor.nextSibling);
				anchor.parentNode.insertBefore(note, tail);
				return { head: anchor, tail: tail, depth: depth, inText: inText };
			}
			block.appendChild(note);
			return null;
		}

		// Puts back together a link that place() ended at a line's end: each
		// copied level takes its children back, down to the split text.
		function rejoin(head, tail, depth, inText) {
			var seam = head.lastChild;
			var first = tail.firstChild;
			while (tail.firstChild) {
				head.appendChild(tail.firstChild);
			}
			tail.remove();
			if (!seam || !first) {
				return;
			}
			if (depth > 0) {
				if (seam.nodeType === 1 && first.nodeType === 1) {
					rejoin(seam, first, depth - 1, inText);
				}
			} else if (inText && seam.nodeType === 3 && first.nodeType === 3) {
				seam.appendData(first.data);
				first.remove();
			}
		}

		function reveal(link, note) {
			var noteBox = note.getBoundingClientRect();
			var overflow = noteBox.bottom + 16 - window.innerHeight;
			if (overflow > 0) {
				window.scrollBy(0, Math.min(overflow, Math.max(0, link.getBoundingClientRect().top - 16)));
			}
		}

		function open(link, note, quietly) {
			var entry = { link: link, note: note, split: place(link, note) };
			openNotes.push(entry);
			link.setAttribute("aria-expanded", "true");
			link.setAttribute("aria-controls", note.id);
			if (openNotes.length === 1) {
				document.addEventListener("keydown", onKey, true);
				window.addEventListener("resize", onResize);
			}
			if (!quietly) {
				reveal(link, note);
			}
		}

		// Notes opened later may sit inside this one's split (two numbers on
		// one line), so they come out first, newest first, and go back after.
		function close(entry) {
			var later = openNotes.slice(openNotes.indexOf(entry) + 1);
			later.slice().reverse().forEach(shut);
			shut(entry);
			later.forEach(function (item) {
				open(item.link, item.note, true);
			});
		}

		function shut(entry) {
			entry.note.remove();
			var split = entry.split;
			if (split && split.tail) {
				if (split.tail.parentNode && split.head.nextSibling === split.tail) {
					rejoin(split.head, split.tail, split.depth, split.inText);
				}
			} else if (split && split.rest.parentNode && split.rest.previousSibling === split.before) {
				split.before.appendData(split.rest.data);
				split.rest.remove();
			}
			entry.link.setAttribute("aria-expanded", "false");
			openNotes.splice(openNotes.indexOf(entry), 1);
			if (!openNotes.length) {
				document.removeEventListener("keydown", onKey, true);
				window.removeEventListener("resize", onResize);
			}
		}

		function onKey(event) {
			if (event.key === "Escape" && openNotes.length) {
				event.preventDefault();
				openNotes.slice().reverse().forEach(shut);
			}
		}

		// A new width moves the line ends, so put open notes back at their
		// marker's new line end.
		function onResize() {
			var entries = openNotes.slice();
			entries.slice().reverse().forEach(shut);
			entries.forEach(function (entry) {
				open(entry.link, entry.note, true);
			});
		}

		document.addEventListener("click", function (event) {
			var link = event.target && event.target.closest ? event.target.closest("a[href*='#']") : null;
			if (!link || !body.contains(link) || link.closest(".calmNote") || !isMarker(link)) {
				return;
			}
			var entry = null;
			openNotes.forEach(function (item) {
				if (item.link === link) {
					entry = item;
				}
			});
			var note = entry ? null : noteFor(link);
			if (!entry && !note) {
				return;
			}
			event.preventDefault();
			event.stopImmediatePropagation();
			if (entry) {
				close(entry);
			} else {
				open(link, note);
			}
		}, true);
	}

	function syncTocMode() {
		if (!body || !toc || !tocList || shouldDisableRail()) {
			if (tocCleanup) {
				tocCleanup();
				tocCleanup = null;
			} else {
				resetToc();
			}
			return;
		}

		if (!tocCleanup) {
			tocCleanup = initToc() || null;
		}
	}

	function observeCompactRail() {
		if (!compactRailQuery) {
			return;
		}
		if (compactRailQuery.addEventListener) {
			compactRailQuery.addEventListener("change", syncTocMode);
		} else if (compactRailQuery.addListener) {
			compactRailQuery.addListener(syncTocMode);
		}
	}

	safely(removeStrayBreaks);
	safely(hideFeedCredit);
	safely(offerSignupPages);
	safely(restoreFootnoteIds);

(function () {
	// Update line. In the two weeks after a Calm release, a long article can
	// end with one faint line naming the new version and a link that installs
	// it. Calm asks GitHub at most once a week, only from long articles, and
	// sends nothing about what you read.
	var BUILD = 16;
	var SOURCE = "https://raw.githubusercontent.com/raisulchowdhury/calm-nnwtheme/main/updates.json";
	var DAY = 24 * 60 * 60 * 1000;
	var CHECK_EVERY = 7 * DAY;
	var WINDOW = 14 * DAY;
	var KEY = "calm.updates";
	var line = document.getElementById("calmUpdate");
	var body = document.getElementById("bodyContainer");
	if (!line || !body) return;

	var words = (body.textContent || "").split(/\s+/).filter(Boolean).length;
	if (words < 250) return;

	function show(entry) {
		if (!entry || !(entry.build > BUILD)) return;
		var released = Date.parse(entry.released);
		if (!(Date.now() - released < WINDOW)) return;
		line.querySelector(".calmUpdateText").textContent = "Calm " + entry.version + " is out.";
		line.hidden = false;
	}

	var cached = null;
	try { cached = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
	if (cached && Date.now() - cached.at < CHECK_EVERY) {
		show(cached.entry);
		return;
	}
	if (typeof fetch !== "function") return;
	fetch(SOURCE, { credentials: "omit", referrerPolicy: "no-referrer", cache: "no-store" })
		.then(function (r) { return r.ok ? r.json() : null; })
		.then(function (entry) {
			try { localStorage.setItem(KEY, JSON.stringify({ at: Date.now(), entry: entry })); } catch (e) {}
			show(entry);
		})
		.catch(function () {});
})();
</script>
