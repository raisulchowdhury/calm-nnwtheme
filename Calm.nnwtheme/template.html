<!-- Template Variables

title: The title of the article
preferred_link: The best link to associate with the article for linking out.

external_link_label: A localized label for the external link.
external_link_stripped: The external link minus the scheme. Useful for displaying the external link.
external_link: The external link of the article if there is one provided by the author.

feed_link_title: The name of the feed associated with this article.
feed_link: The URL of the feed associated with this article.
byline: HTML that combines all the authors and links to them if available.
avatar_src: The image source URL for the feed icon / avatar.
dateline_style: Either "articleDateline" or "articleDatelineTitle" depending on if the title was populated or not.

datetime_long: Long version of a combined publish date and time.
datetime_medium: Medium length version of a combined publish date and time.
datetime_short: Short version of a combined publish date and time.

date_long: Long version of the publish date.
date_medium: Medium version of the publish date.
date_short: Medium version of the publish date.

time_long: Long version of the publish time.
time_medium: Medium version of the publish time.
time_short: Medium version of the publish time.

text_size_class: The size class that the user has selected in Preferences for article text.
body: The body of the article.

-->

<nav class="readerToc" aria-label="Article sections" hidden>
	<div class="readerTocTitle">Sections</div>
	<div class="readerTocContext" aria-hidden="true"></div>
	<ol id="readerTocList"></ol>
</nav>

<header class="articleHeader" id="readerTop">
	<div class="articleTitle"><h1><a href="[[preferred_link]]">[[title]]</a></h1></div>
	<div class="articleMeta">
		<span class="byline">[[byline]]</span>
		<span class="metaDate"><a href="[[preferred_link]]">[[date_medium]]</a></span>
		<span class="feedName"><a href="[[feed_link]]">[[feed_link_title]]</a></span>
		<span class="readingTime" id="readingTime" hidden></span>
	</div>
	<div class="externalLink">[[external_link_label]] <a href="[[external_link]]">[[external_link_stripped]]</a></div>
</header>

<article>
	<div id="bodyContainer" class="articleBody [[text_size_class]]">[[body]]</div>
</article>

<script>
(function () {
	var body = document.getElementById("bodyContainer");
	var toc = document.querySelector(".readerToc");
	var tocList = document.getElementById("readerTocList");
	var tocContext = toc ? toc.querySelector(".readerTocContext") : null;
	var readingTime = document.getElementById("readingTime");
	var title = document.querySelector(".articleTitle h1");
	var header = document.getElementById("readerTop");
	var externalLink = document.querySelector(".externalLink");
	var externalLinkAnchor = externalLink ? externalLink.querySelector("a") : null;
	var compactRailQuery = window.matchMedia ?
		window.matchMedia("(max-width: 820px), (pointer: coarse) and (max-height: 500px)") :
		null;

	function shouldDisableRail() {
		return compactRailQuery && compactRailQuery.matches;
	}

	function isPlaceholderValue(value) {
		return /^\s*\[\[[^\]]+\]\]\s*$/.test(value || "");
	}

	function hideEmptyExternalLink() {
		if (!externalLink) {
			return;
		}

		var href = externalLinkAnchor ? externalLinkAnchor.getAttribute("href") || "" : "";
		var label = externalLink.textContent.trim();
		var linkText = externalLinkAnchor ? externalLinkAnchor.textContent.trim() : "";
		if (!externalLinkAnchor || !href || !linkText || isPlaceholderValue(href) || isPlaceholderValue(linkText) || isPlaceholderValue(label)) {
			externalLink.hidden = true;
		}
	}

	function hideReadingTime() {
		if (!readingTime) {
			return;
		}
		readingTime.hidden = true;
		readingTime.textContent = "";
		readingTime.removeAttribute("aria-label");
	}

	function updateReadingTime() {
		if (!body || !readingTime) {
			hideReadingTime();
			return;
		}

		var text = (body.innerText || body.textContent || "").trim();
		var words = text ? text.split(/\s+/).filter(Boolean).length : 0;
		var minutes = Math.ceil(words / 225);
		if (minutes < 4) {
			hideReadingTime();
			return;
		}

		readingTime.textContent = minutes + " min";
		readingTime.setAttribute("aria-label", "Estimated reading time: " + minutes + " minutes");
		readingTime.hidden = false;
	}

	function initToc() {
		if (!body || !toc || !tocList || shouldDisableRail()) {
			if (toc) {
				toc.hidden = true;
			}
			return;
		}

		var titleText = title ? title.textContent.trim() : "";
		var markerCount = 5;
		var root = document.documentElement;
		var markerLabels = ["Top", "25%", "50%", "75%", "Bottom"];
		var reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
		var hasPointerEvents = "PointerEvent" in window;
		var isScrubbing = false;
		var scrubIndex = -1;
		var activePointerId = null;
		var activeTouchId = null;
		var markerCenters = [];

		function getScrollMax() {
			return Math.max(0, root.scrollHeight - window.innerHeight);
		}

		function getMarkerOffset() {
			return Math.max(72, Math.min(128, window.innerHeight * 0.12));
		}

		function normalizeHeadingText(text) {
			return text.replace(/\s+/g, " ").trim().toLowerCase();
		}

		var rawHeadings = Array.prototype.slice.call(body.querySelectorAll("h1, h2, h3, h4, h5, h6"))
			.filter(function (heading) {
				return heading.textContent.trim().length > 0;
			});
		var titleKey = normalizeHeadingText(titleText);
		var sectionHeadings = rawHeadings.filter(function (heading) {
			return !titleKey || normalizeHeadingText(heading.textContent) !== titleKey;
		});
		var hasTopLevelSection = sectionHeadings.some(function (heading) {
			return Number(heading.tagName.slice(1)) <= 2;
		});
		var fallbackLevel = sectionHeadings.reduce(function (level, heading) {
			return Math.min(level, Number(heading.tagName.slice(1)));
		}, 6);
		var headings = sectionHeadings.filter(function (heading) {
			var level = Number(heading.tagName.slice(1));
			return hasTopLevelSection ? level <= 2 : level === fallbackLevel;
		});
		var useHeadingTargets = headings.length > 4;

		if (getScrollMax() < 240) {
			toc.hidden = true;
			return;
		}
		toc.classList.toggle("is-heading-based", useHeadingTargets);

		if (titleText) {
			markerLabels[0] = titleText;
		}

		function addTocItem(text, className) {
			var item = document.createElement("li");
			var control = document.createElement("button");
			item.className = className;
			control.type = "button";
			control.setAttribute("aria-label", text);
			control.setAttribute("data-label", text);
			control.textContent = text;
			item.appendChild(control);
			tocList.appendChild(item);
		}

		tocList.textContent = "";
		var sectionTargets = [];
		if (useHeadingTargets) {
			if (titleText && header) {
				addTocItem(titleText, "article");
				sectionTargets.push({ element: header, top: 0 });
			}
			headings.forEach(function (heading) {
				addTocItem(heading.textContent.trim(), heading.tagName.toLowerCase());
				sectionTargets.push({ element: heading });
			});
		} else {
			for (var i = 0; i < markerCount; i++) {
				var ratio = i / (markerCount - 1);
				var label = markerLabels[i] || ("Section " + (i + 1));
				var cssClass = i === 0 ? "article" : "section";
				addTocItem(label, cssClass);
				sectionTargets.push({ ratio: ratio });
			}
		}

		if (tocList.children.length < 1) {
			toc.hidden = true;
			return;
		}
		toc.hidden = false;

		var controls = Array.prototype.slice.call(tocList.querySelectorAll("button"));

		function setActiveSection(activeIndex) {
			controls.forEach(function (control, index) {
				var item = control.parentElement;
				var isActive = index === activeIndex;
				control.classList.toggle("active", isActive);
				if (!item) {
					return;
				}
				item.classList.toggle("is-before", activeIndex > -1 && index < activeIndex);
				item.classList.toggle("is-after", activeIndex > -1 && index > activeIndex);
			});

			var activeControl = activeIndex > -1 ? controls[activeIndex] : null;
			if (tocContext && useHeadingTargets && activeControl) {
				var activeRect = activeControl.getBoundingClientRect();
				var tocRect = toc.getBoundingClientRect();
				tocContext.textContent = activeControl.getAttribute("data-label") || "";
				tocContext.style.top = (activeRect.top - tocRect.top + activeRect.height / 2) + "px";
			} else if (tocContext) {
				tocContext.textContent = "";
				tocContext.style.top = "";
			}
		}

		if (controls[0]) {
			setActiveSection(0);
		}

		function getTargetTop(section) {
			var scrollTop = window.pageYOffset || root.scrollTop || document.body.scrollTop || 0;
			if (section.element) {
				return typeof section.top === "number" ? section.top : section.element.getBoundingClientRect().top + scrollTop;
			}
			return Math.round(getScrollMax() * section.ratio);
		}

		function cacheMarkerCenters() {
			markerCenters = controls.map(function (control) {
				var rect = control.getBoundingClientRect();
				return rect.top + rect.height / 2;
			});
		}

		function getNearestMarkerIndexFromY(clientY) {
			if (markerCenters.length < 1) {
				return -1;
			}

			var activeIndex = 0;
			var bestDistance = Infinity;
			markerCenters.forEach(function (centerY, index) {
				var distance = Math.abs(centerY - clientY);
				if (distance < bestDistance) {
					bestDistance = distance;
					activeIndex = index;
				}
			});
			return activeIndex;
		}

		function setScrubTargetFromY(clientY) {
			var nextIndex = getNearestMarkerIndexFromY(clientY);
			if (nextIndex !== scrubIndex) {
				scrubIndex = nextIndex;
				setActiveSection(scrubIndex);
			}
		}

		function beginScrub(pointerId, clientY) {
			isScrubbing = true;
			activePointerId = pointerId;
			cacheMarkerCenters();
			setScrubTargetFromY(clientY);
			toc.classList.add("isScrubbing");
		}

		function moveScrub(clientY) {
			if (!isScrubbing) {
				return;
			}
			setScrubTargetFromY(clientY);
		}

		function endScrub() {
			if (!isScrubbing) {
				return;
			}
			isScrubbing = false;
			toc.classList.remove("isScrubbing");
			activePointerId = null;
			activeTouchId = null;
			var indexToScroll = scrubIndex;
			scrubIndex = -1;
			if (indexToScroll > -1) {
				scrollToSection(sectionTargets[indexToScroll]);
			}
			updateActiveFromScroll();
		}

		function getBehavior() {
			if (reducedMotionQuery && reducedMotionQuery.matches) {
				return "auto";
			}
			return "smooth";
		}

		function updateActiveFromScroll() {
			if (sectionTargets.length < 1) {
				return;
			}

			var markerOffset = getMarkerOffset();
			var scrollTop = window.pageYOffset || root.scrollTop || document.body.scrollTop || 0;
			var scrollLimit = getScrollMax();
			if (scrollLimit - scrollTop < markerOffset) {
				setActiveSection(sectionTargets.length - 1);
				return;
			}

			var activeIndex = 0;
			sectionTargets.forEach(function (section, index) {
				if (scrollTop + markerOffset >= getTargetTop(section)) {
					activeIndex = index;
				}
			});
			setActiveSection(activeIndex);
		}

		function scrollToSection(section) {
			if (!section) {
				return;
			}
			var markerOffset = getMarkerOffset();
			var targetTop = getTargetTop(section);
			var nextTop = targetTop <= 0 ? 0 : targetTop - markerOffset;
			var scrollMax = getScrollMax();
			nextTop = Math.max(0, Math.min(scrollMax, nextTop));
			try {
				window.scrollTo({
					top: nextTop,
					left: 0,
					behavior: getBehavior()
				});
			} catch (error) {
				window.scrollTo(0, nextTop);
			}
		}

		function getTouchPoint(event, touchId) {
			var points = event.touches || event.changedTouches;
			if (!points || points.length < 1) {
				return null;
			}
			for (var i = 0; i < points.length; i++) {
				var touch = points[i];
				if (touch.identifier === touchId) {
					return touch;
				}
			}
			return points[0];
		}

		function onPointerDown(event) {
			if (event.button && event.button !== 0) {
				return;
			}
			if (!event.isPrimary) {
				return;
			}
			event.preventDefault();
			if (toc.setPointerCapture) {
				try {
					toc.setPointerCapture(event.pointerId);
				} catch (error) {
					// Without capture, the pointerleave listener still ends the scrub.
				}
			}
			beginScrub(event.pointerId, event.clientY);
		}

		function onPointerMove(event) {
			if (!isScrubbing || event.pointerId !== activePointerId) {
				return;
			}
			event.preventDefault();
			moveScrub(event.clientY);
		}

		function onPointerEnd(event) {
			if (!isScrubbing) {
				return;
			}
			if (activePointerId !== null && event.pointerId !== activePointerId) {
				return;
			}
			event.preventDefault();
			endScrub();
		}

		function onTouchStart(event) {
			if (isScrubbing || !event.touches || event.touches.length < 1) {
				return;
			}
			var touch = event.touches[0];
			activeTouchId = touch.identifier;
			event.preventDefault();
			beginScrub(null, touch.clientY);
		}

		function onTouchMove(event) {
			if (!isScrubbing || !event.touches || event.touches.length < 1) {
				return;
			}
			var touch = getTouchPoint(event, activeTouchId);
			if (!touch) {
				return;
			}
			event.preventDefault();
			moveScrub(touch.clientY);
		}

		function onTouchEnd(event) {
			if (!isScrubbing) {
				return;
			}
			if (!event.changedTouches || event.changedTouches.length < 1) {
				return;
			}
			var touch = getTouchPoint(event, activeTouchId);
			if (!touch) {
				return;
			}
			event.preventDefault();
			endScrub();
		}

		if (hasPointerEvents) {
			toc.addEventListener("pointerdown", onPointerDown, { passive: false });
			toc.addEventListener("pointermove", onPointerMove, { passive: false });
			toc.addEventListener("pointerup", onPointerEnd, { passive: false });
			toc.addEventListener("pointercancel", onPointerEnd, { passive: false });
			toc.addEventListener("pointerleave", onPointerEnd, { passive: false });
		} else {
			toc.addEventListener("touchstart", onTouchStart, { passive: false });
			toc.addEventListener("touchmove", onTouchMove, { passive: false });
			toc.addEventListener("touchend", onTouchEnd, { passive: false });
			toc.addEventListener("touchcancel", onTouchEnd, { passive: false });
		}

		controls.forEach(function (control, index) {
			control.addEventListener("click", function (event) {
				event.preventDefault();
				scrollToSection(sectionTargets[index]);
				setActiveSection(index);
			});
		});

		cacheMarkerCenters();
		updateActiveFromScroll();
		window.addEventListener("scroll", updateActiveFromScroll, { passive: true });
		window.addEventListener("resize", function () {
			cacheMarkerCenters();
			updateActiveFromScroll();
		});
	}

	hideEmptyExternalLink();
	updateReadingTime();
	initToc();
})();
</script>
