name: Validate theme

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate source and release package
        run: scripts/validate.sh

      - name: Check whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps webkit chromium

      - name: Run WebKit regression suite
        run: npm run test:browser -- --update-snapshots

      - name: Upload canonical browser snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calm-browser-snapshots
          path: tests/theme.spec.mjs-snapshots/
