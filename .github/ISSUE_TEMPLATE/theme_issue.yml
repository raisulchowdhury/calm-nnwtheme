name: Calm theme issue
description: Report a rendering, layout, or interaction problem with Calm.
title: "[Theme] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Calm. If the problem also appears with a built-in NetNewsWire theme, please use NetNewsWire's issue tracker instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Mac
        - iPhone
        - iPad
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Example: macOS 26.0 or iOS 26.0"
    validations:
      required: true
  - type: input
    id: netnewswire-version
    attributes:
      label: NetNewsWire version
      placeholder: "Example: 7.1.1"
    validations:
      required: true
  - type: input
    id: calm-version
    attributes:
      label: Calm version
      placeholder: "Example: 1.4.0"
    validations:
      required: true
  - type: dropdown
    id: appearance
    attributes:
      label: Appearance
      options:
        - Light
        - Dark
        - Automatic
        - Both
    validations:
      required: true
  - type: input
    id: layout
    attributes:
      label: Window mode and orientation
      description: Include Split View or Stage Manager if relevant.
      placeholder: "Example: iPad Split View, portrait"
  - type: input
    id: text-size
    attributes:
      label: NetNewsWire text size
      placeholder: "Example: default, two steps larger"
  - type: input
    id: article-url
    attributes:
      label: Article URL
      description: Share the affected article when it is public.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Change…
        3. Scroll…
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots or recording
      description: Drag files here. Remove private feed or account details first.
  - type: checkboxes
    id: built-in-theme
    attributes:
      label: Scope check
      options:
        - label: I checked whether the problem also appears with a built-in NetNewsWire theme.
          required: true
